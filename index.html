<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Spike 포트폴리오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: left rail with the nine web menus on wide screens; on phones the rail
   folds into a five-tab bottom bar (홈·기록·포트폴리오·지원·마이). Ivy-green ink on
   a cool, faintly green paper; amber only for deadlines. */
:root{
  --paper:#f4f6f2; --surface:#ffffff; --sunk:#eaeee8; --ink:#16201b; --muted:#5a6660;
  --line:#dbe1da; --ivy:#1d5a47; --ivy-ink:#ffffff; --ivy-soft:#e0ece6;
  --amber:#9a5a00; --amber-soft:#fbeedb; --danger:#b3261e; --danger-soft:#fbe5e3;
  --ok:#2c7a4b;
  --t1:#1d5a47; --t2:#3d6fb6; --t3:#a45a8a; --t4:#b07a1e; --t5:#5c6b78;
  --f-display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101512; --surface:#171e1a; --sunk:#1d2621; --ink:#e4ebe6; --muted:#98a59e;
    --line:#2a3530; --ivy:#72c4a4; --ivy-ink:#0c1a14; --ivy-soft:#1a2e26;
    --amber:#e8a94f; --amber-soft:#33291a; --danger:#f08a82; --danger-soft:#3a1f1d;
    --ok:#7bd19c;
    --t1:#72c4a4; --t2:#86aee8; --t3:#d898c2; --t4:#e3b866; --t5:#9fb0bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101512; --surface:#171e1a; --sunk:#1d2621; --ink:#e4ebe6; --muted:#98a59e;
  --line:#2a3530; --ivy:#72c4a4; --ivy-ink:#0c1a14; --ivy-soft:#1a2e26;
  --amber:#e8a94f; --amber-soft:#33291a; --danger:#f08a82; --danger-soft:#3a1f1d;
  --ok:#7bd19c;
  --t1:#72c4a4; --t2:#86aee8; --t3:#d898c2; --t4:#e3b866; --t5:#9fb0bd;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ivy)}
:focus-visible{outline:2px solid var(--ivy);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:16px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ivy-soft);color:var(--ivy);font-weight:600}
.nav a[aria-current="page"] .k{color:var(--ivy)}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mode{font-size:12px;color:var(--muted);padding:0 10px}
.mode b{color:var(--ink);font-weight:500}

.topbar{display:none}
main{min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar,.fab,.segbar{display:none}

/* type */
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-size:clamp(24px,3.2vw,32px);line-height:1.25;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14.5px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:0;max-width:62ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head>div{min-width:0}
.small{font-size:13px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .main{flex:1;min-width:0}
.row .side{display:flex;gap:6px;align-items:center;flex-shrink:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunk)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.desc{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* chips & state */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ivy{background:var(--ivy-soft);color:var(--ivy)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.ok{color:var(--ok);background:var(--ivy-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ivy);border-color:var(--ivy);color:var(--ivy-ink);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* progress */
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ivy);border-radius:999px}
.area{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px;padding:8px 0;text-decoration:none;color:var(--ink)}
.area:hover .lab{color:var(--ivy)}
.area .pct{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:center}
.ring{position:relative;width:160px;height:160px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--f-display);font-size:38px;line-height:1}
.ring .c span{font-size:12px;color:var(--muted);margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:12.5px;color:var(--muted)}
.dday{font-family:var(--f-mono);font-weight:500;font-size:14px;min-width:58px;text-align:right}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg a,.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--muted);text-decoration:none;cursor:pointer}
.seg a[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--amber-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:20px}
.banner b{color:var(--amber)}

/* spike */
.spike{display:flex;flex-direction:column;gap:14px}
.theme{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:12px;align-items:center}
.theme .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tl{overflow-x:auto}
.tl-grid{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px;min-width:700px}
.tl-col{display:flex;flex-direction:column;gap:8px}
.tl-col h3{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.tl-item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:7px;padding:7px 10px;font-size:13px;line-height:1.4}
.tl-item small{display:block;color:var(--muted);font-size:11.5px}

/* common app */
.ca{display:flex;flex-direction:column;gap:10px}
.ca-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px}
.ca-item .n{font-family:var(--f-mono);color:var(--muted);font-size:13px;padding-top:2px}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:4px 0;font-size:14px}
.fld .k{font-size:12px;color:var(--muted)}
.fld .v{overflow-wrap:anywhere}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.cnt.over{color:var(--danger);font-weight:500}
textarea.out{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;resize:vertical}
.q{padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.q:first-child{border-top:none}
.q small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet .body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.f .lab{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f textarea.big{min-height:220px}
.f .hint{font-size:12px;color:var(--muted)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:400;cursor:pointer}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

.report-h{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* photos */
.ph{display:block;padding:0;border:none;background:var(--sunk);border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.thumb{width:84px;height:84px;flex-shrink:0;border-radius:8px}
.thumb .n{position:absolute;right:4px;bottom:4px;background:rgba(10,16,13,.7);color:#fff;font-size:11px;font-family:var(--f-mono);padding:0 6px;border-radius:6px}
.thumb.sm{width:52px;height:52px}
.cover{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip .ph{width:64px;height:64px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.gallery .ph{aspect-ratio:4/3;width:100%}
.gallery figcaption{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-item .ph{width:100%;height:76px;margin:-1px 0 6px;border-radius:5px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--sunk);flex-shrink:0;display:block}
.avatar.lg{width:88px;height:88px}
.who{display:flex;gap:14px;align-items:center;min-width:0}
.who>div{min-width:0}
.rail .me{display:flex;gap:10px;align-items:center;padding:0 10px;text-decoration:none;color:var(--ink)}
.rail .me img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--sunk)}
.rail .me span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pedit .item{position:relative;width:88px;height:88px}
.pedit .item .ph{width:100%;height:100%}
.pedit .item button.rm{position:absolute;top:4px;right:4px;border:none;border-radius:6px;background:rgba(10,16,13,.75);color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
.pedit .item button.rm.armed{background:var(--danger)}
.upl{width:88px;height:88px;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;text-align:center}
.upl:hover{border-color:var(--ivy);color:var(--ivy)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.upl:focus-within{outline:2px solid var(--ivy);outline-offset:2px}
.ill{width:100%;max-width:340px;height:auto;border-radius:12px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,10,8,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:78vh;border-radius:8px;object-fit:contain;background:#fff}
.lb p{color:#e8ece9;margin:0;font-size:14px;text-align:center}
.lb button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
.ex-tag{position:absolute;left:4px;top:4px;background:rgba(255,255,255,.85);color:#16201b;font-size:10px;padding:0 5px;border-radius:4px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;justify-content:space-between;gap:12px}
  .topbar b{font-family:var(--f-display);font-size:18px}
  .wrap{padding-block:20px 120px}
  .segbar{display:block;margin-bottom:16px;overflow-x:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted);text-decoration:none}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--ivy);font-weight:600}
  .fab{display:flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:41;
    width:54px;height:54px;border-radius:50%;background:var(--ivy);color:var(--ivy-ink);border:none;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center;gap:18px}
  .hero>div:last-child{width:100%}
  .head .btns.desk{display:none}
  .fld{grid-template-columns:minmax(0,1fr) auto}
  .fld .k{grid-column:1/-1}
  .theme{grid-template-columns:minmax(0,1fr) 32px}
  .theme .nm{grid-column:1/-1}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .f2{grid-template-columns:1fr}
  .area{grid-template-columns:96px minmax(0,1fr) 40px}
  .thumb{width:60px;height:60px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.ring circle{transition:all .5s ease}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail" aria-label="주 메뉴">
    <div class="brand"><b>Spike</b><span>미국 대학 입시 포트폴리오</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <a class="me" href="#my" id="me"></a>
      <button class="btn pri" data-act="add">+ 새 기록</button>
      <div class="mode" id="mode">불러오는 중…</div>
    </div>
  </aside>
  <main>
    <div class="topbar"><b>Spike</b><span class="small" id="mode-m"></span></div>
    <div class="wrap" id="view">
      <p class="small">포트폴리오를 불러오는 중입니다…</p>
    </div>
  </main>

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url});
    let max=1100,q=.8,out="";
    for(let k=0;k<6;k++){
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      const x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);if(out.length<230000)break;max=Math.round(max*.8);q=Math.max(.5,q-.08);
    }
    return out;
  }finally{URL.revokeObjectURL(url)}
}
async function addPhotos(files,parent){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif)$/i.test(f.name));
  if(!list.length){toast("JPG·PNG 사진 파일을 골라 주세요");return 0}
  let n=0;
  for(const f of list.slice(0,6)){
    try{const src=await shrink(f);await putItem({id:"ph-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:"photo",parent,src,created:Date.now()});n++}
    catch(e){toast("이 사진 형식은 열 수 없어요. JPG나 PNG로 올려 주세요")}
  }
  return n;
}

function themes(){const s=new Set();S.items.forEach(i=>{if(i.theme)s.add(i.theme.trim())});(S.profile.themes||[]).forEach(t=>s.add(t));return [...s].filter(Boolean)}

/* ---------- derived ---------- */
function gpa(){
  const cs=by("course").filter(c=>c.mark in GP);
  if(!cs.length)return null;
  let u=0,w=0;
  cs.forEach(c=>{const g=GP[c.mark];u+=g;const b=(c.level==="AP"||c.level==="IB HL")?1:(c.level==="Honors"||c.level==="IB SL")?.5:0;w+=g>0?g+b:0});
  return {u:(u/cs.length).toFixed(2),w:(w/cs.length).toFixed(2),n:cs.length};
}
function bestTest(){
  const t=by("test");const sat=t.filter(x=>x.name==="SAT").map(x=>+x.score||0);const act=t.filter(x=>x.name==="ACT").map(x=>+x.score||0);
  if(sat.length)return "SAT "+Math.max(...sat);if(act.length)return "ACT "+Math.max(...act);return null;
}
function actHours(a){return (+a.hours||0)*(+a.weeks||0)*Math.max(1,(a.grades||[]).length)}
function topActivities(){return by("activity").slice().sort((a,b)=>actHours(b)-actHours(a)).slice(0,10)}
function topHonors(){return by("honor").slice().sort((a,b)=>(LEVEL_W[b.level]||0)-(LEVEL_W[a.level]||0)||Math.max(0,...(b.grades||[]).map(Number))-Math.max(0,...(a.grades||[]).map(Number))).slice(0,5)}
function spike(){
  const m={};["activity","research","honor","idea"].forEach(t=>by(t).forEach(i=>{const k=(i.theme||"").trim();if(!k)return;(m[k]=m[k]||{activity:0,research:0,honor:0,idea:0,total:0});m[k][t]++;m[k].total++}));
  const arr=Object.entries(m).map(([name,v])=>Object.assign({name},v)).sort((a,b)=>b.total-a.total);
  const all=arr.reduce((s,x)=>s+x.total,0);
  return {arr,all,top:arr[0]||null,share:all?arr[0].total/all:0};
}
function areas(){
  const c=by("course").length,t=by("test").length,a=by("activity").length,r=by("research"),h=by("honor").length,e=by("essay");
  const sp=spike();
  return [
    ["academics","학업",(Math.min(c/6,1)*.6)+(t?0.4:0)],
    ["activities","활동",a/10],
    ["research","연구",r.length?(r.some(x=>x.stage==="완료")?1:.6):0],
    ["honors","수상",h/5],
    ["story","스토리",(S.profile.major?.4:0)+(sp.top&&sp.top.total>=3&&sp.share>=.4?.6:sp.top?.3:0)],
    ["apply","지원서",(e.length?.4:0)+Math.min(e.filter(x=>x.status==="완료").length/2,1)*.6]
  ];
}
function overall(){const a=areas();return pct(a.reduce((s,x)=>s+Math.min(1,x[2]),0)/a.length)}
function upcoming(){return (S.profile.targets||[]).map(t=>Object.assign({},t,{d:dday(t.due)})).filter(t=>t.d!=null&&t.d>=0).sort((a,b)=>a.d-b.d)}
function todos(){
  const out=[];const a=by("activity");
  const up=upcoming()[0];
  if(up)out.push([up.d<=7?"amber":"ivy",`${up.name} ${up.plan||""} 마감 ${ddLabel(up.d)} — 지원서 최종 점검`,"apply"]);
  if(a.length<10)out.push(["",`활동 ${10-a.length}개 더 기록하면 Common App 활동란 10칸을 채웁니다`,"activities"]);
  const over=a.filter(x=>(x.desc||"").length>150).length;
  if(over)out.push(["danger",`활동 설명 150자 초과 ${over}건 — 줄여야 합니다`,"apply"]);
  const nodesc=a.filter(x=>!x.desc).length;
  if(nodesc)out.push(["",`설명이 비어 있는 활동 ${nodesc}건`,"activities"]);
  const h=by("honor").length;if(h<5)out.push(["",`수상 ${5-h}건 더 기록 가능 (Honors 5칸)`,"honors"]);
  const ed=by("essay").filter(x=>x.status!=="완료");if(ed.length)out.push(["",`진행 중인 에세이 ${ed.length}편 — ${ed.map(x=>x.title).slice(0,2).join(", ")}`,"apply"]);
  if(!by("research").length)out.push(["","연구·프로젝트를 1건 이상 기록해 보세요","research"]);
  if(!S.profile.major)out.push(["","희망 전공을 정하면 스토리 분석이 정확해집니다","my"]);
  return out.slice(0,6);
}

/* ---------- persistence ---------- */
async function putItem(it){
  if(S.mode==="db"){
    try{await col.doc(it.id).set(it)}catch(e){toast(e&&e.code==="quota_exceeded"?"저장 공간이 가득 찼습니다. 오래된 기록을 지워 주세요.":"저장하지 못했어요. 이 페이지에 쓸 권한이 있는지 확인해 주세요.")}
  }else{const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);render()}
}
async function delItem(id){
  const kids=S.items.filter(x=>x.type==="photo"&&x.parent===id&&x.id!==id).map(x=>x.id);
  if(S.mode==="db"){try{await col.doc(id).delete();for(const k of kids)await col.doc(k).delete()}catch(e){toast("삭제하지 못했어요.")}}
  else{S.items=S.items.filter(x=>x.id!==id&&!kids.includes(x.id));render()}
}
async function putProfile(p){
  S.profile=p;
  if(S.mode==="db"){try{await col.doc("profile").set(p)}catch(e){toast("프로필을 저장하지 못했어요.")}}
  render();
}

function rowItem(i){
  let t="",m=[];
  if(i.type==="course"){t=i.subject;m=[i.level,i.grade&&i.grade+"학년 "+(i.sem||"")+"학기",i.mark&&"성적 "+i.mark]}
  else if(i.type==="test"){t=i.name+(i.subject?" "+i.subject:"");m=["점수 "+i.score,fmtDate(i.date)]}
  else if(i.type==="activity"){t=i.role+" · "+i.name;m=[i.category,(i.grades||[]).join("·")&&(i.grades||[]).join("·")+"학년",i.hours&&i.hours+"시간/주"]}
  else if(i.type==="research"){t=i.title;m=[i.stage,i.competition]}
  else if(i.type==="honor"){t=i.title;m=[i.level,(i.grades||[]).join("·")&&(i.grades||[]).join("·")+"학년"]}
  else if(i.type==="essay"){t=i.title+(i.school?" — "+i.school:"");m=[i.status,words(i.body)+(i.limit?"/"+i.limit:"")+" words"]}
  else{t=i.text||i.topic||"";m=[]}
  return `<div class="row click" data-act="edit" data-id="${esc(i.id)}">${thumb(i,"sm")}<div class="main"><span class="chip ${i.type==="activity"||i.type==="research"?"ivy":""}">${TYPE_LABEL[i.type]}</span><h3 style="font-weight:500">${esc(t)}</h3><div class="meta">${m.filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></div>`;
}

function brag(){
  const p=S.profile,sp=spike(),g=gpa();
  const L=[`Brag Sheet — ${p.name||""}`,`${p.school||""}${p.grade?", Grade "+p.grade:""}${p.major?" | Intended major: "+p.major:""}`,""];
  if(sp.top)L.push(`Core interest: ${sp.top.name}`,"");
  if(g)L.push(`GPA: ${g.u} (unweighted), ${g.w} (weighted)`);
  const bt=bestTest();if(bt)L.push(`Testing: ${bt}`);
  L.push("","Key activities:");topActivities().slice(0,5).forEach(a=>L.push(`- ${a.role}, ${a.name}${a.desc?": "+a.desc:""}`));
  const r=by("research");if(r.length){L.push("","Research:");r.forEach(x=>L.push(`- ${x.title}${x.competition?" ("+x.competition+")":""}`))}
  const h=topHonors();if(h.length){L.push("","Honors:");h.forEach(x=>L.push(`- ${x.title} (${LEVEL_CA[x.level]||""})`))}
  L.push("","What I hope my recommender can speak to:","- ");
  return L.join("\n");
}
function interviewQs(){

let M=null;
function openForm(type,item){
  M={type,item:item||null,id:item?item.id:rid()};
  const v=item||{};const tl=themes();
  const field=f=>{
    if(f.row)return `<div class="f2">${f.row.map(field).join("")}</div>`;
    const id="m-"+f.k,val=v[f.k]==null?"":v[f.k];
    const cnt=f.max?`<span class="cnt" id="c-${f.k}">${String(val).length}/${f.max}</span>`:"";
    let input;
    if(f.opt)input=`<select id="${id}" name="${f.k}">${f.opt.map(o=>`<option ${String(val)===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if(f.multi)return `<div class="f"><span class="lab">${f.l}</span><div class="checks">${f.multi.map(o=>`<label><input type="checkbox" name="${f.k}" value="${o}" id="${id}-${o}" ${(v[f.k]||[]).includes(o)?"checked":""}>${o}학년</label>`).join("")}</div></div>`;
    else if(f.ta)input=`<textarea id="${id}" name="${f.k}" class="${f.big?"big":""}" ${f.max?`data-max="${f.max}"`:""}>${esc(val)}</textarea>`;
    else input=`<input id="${id}" name="${f.k}" type="${f.t||"text"}" value="${esc(val)}" placeholder="${esc(f.ph||"")}" ${f.list?'list="themes-dl"':""} ${f.max?`data-max="${f.max}"`:""} ${f.req?"required":""}>`;
    return `<div class="f"><label for="${id}"><span>${f.l}${f.req?" *":""}</span>${cnt}</label>${input}${f.hint?`<span class="hint">${f.hint}</span>`:""}</div>`;
  };
  const wc=type==="essay"?`<span class="cnt" id="wc">${words(v.body)} words</span>`:"";
  $("#modal").innerHTML=`<div class="scrim" data-act="close-bg"><form class="sheet" id="mf" novalidate>
    <header><h2>${TYPE_LABEL[type]} ${item?"수정":"추가"}</h2>${wc}<button type="button" class="btn ghost sm" data-act="close">닫기</button></header>
    <div class="body">${PHOTO_TYPES.includes(type)?`<div class="f"><span class="lab"><span>사진·증빙 자료</span><span class="cnt">최대 6장</span></span><div class="pedit" id="pedit">${photoEdit(M.id)}</div><span class="hint">${type==="honor"?"상장·메달 사진":"활동 현장, 결과물, 발표 장면"}을 올리면 대시보드 갤러리, 타임라인, 학부모 리포트, 내보내기 파일에 함께 들어갑니다.</span></div>`:""}${FIELDS[type].map(field).join("")}<datalist id="themes-dl">${tl.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
    <footer><div>${item?`<button type="button" class="btn danger" data-act="del">삭제</button>`:""}</div><div class="btns"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn pri">저장</button></div></footer>
  </form></div>`;
  const first=$("#mf input:not([type=checkbox]), #mf textarea, #mf select");if(first&&window.innerWidth>860)first.focus();
}
function photoEdit(pid){
  const ps=photosOf(pid);
  return ps.map(p=>`<div class="item">${phBtn(p,"첨부 사진")}<button type="button" class="rm" data-act="ph-rm" data-id="${esc(p.id)}">삭제</button></div>`).join("")

function refreshPhotoEdit(){const el=$("#pedit");if(el&&M)el.innerHTML=photoEdit(M.id)}
function closeForm(){
  if(M&&!M.item&&!M.keep){photosOf(M.id).forEach(p=>delItem(p.id))}
  M=null;$("#modal").innerHTML="";if(S.mode==="db")render()
}
function readForm(f){
  const out={};
  FIELDS[M.type].flatMap(x=>x.row||[x]).forEach(d=>{
    if(d.multi){out[d.k]=[...f.querySelectorAll(`input[name="${d.k}"]:checked`)].map(x=>x.value)}
    else{const el=f.elements[d.k];let v=el?el.value.trim():"";if(d.t==="number")v=v===""?"":Number(v);out[d.k]=v}
  });
  return out;
}

/* ---------- copy ---------- */
async function copyText(t,el){
  try{await navigator.clipboard.writeText(t);toast("복사했습니다")}
  catch(e){if(el&&el.select){el.focus();el.select();toast("자동 복사가 막혀 있어요. 선택된 글을 직접 복사하세요")}else toast("자동 복사가 막혀 있어요")}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="close-bg"&&e.target!==b)return;
  if(a==="add"){const map={academics:"course",research:"research",honors:"honor",story:"idea",apply:"essay",counsel:"req",my:"target"};openForm(map[S.route]||"activity");return}
  if(a==="new"){openForm(b.dataset.type);return}
  if(a==="edit"){const it=S.items.find(x=>x.id===b.dataset.id);if(it)openForm(it.type,it);return}
  if(a==="edit-target"){const t=(S.profile.targets||[]).find(x=>x.id===b.dataset.id);if(t)openForm("target",t);return}
  if(a==="close"||a==="close-bg"){closeForm();return}
  if(a==="view-photo"){e.preventDefault();e.stopPropagation();openPhoto(b.dataset.id);return}
  if(a==="lb-close"){$("#lb").innerHTML="";return}
  if(a==="ph-rm"){
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="확인";return}
    await delItem(b.dataset.id);refreshPhotoEdit();toast("사진을 지웠습니다");return;
  }
  if(a==="av-rm"){for(const p of photosOf("profile"))await delItem(p.id);render();toast("프로필 사진을 지웠습니다");return}
  if(a==="del"){
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="한 번 더 누르면 삭제";return}
    const it=M&&M.item,tp=M&&M.type;closeForm();if(!it)return;
    if(tp==="target"){const p=Object.assign({},S.profile);p.targets=(p.targets||[]).filter(x=>x.id!==it.id);await putProfile(p)}else await delItem(it.id);
    toast("삭제했습니다");return;
  }
  if(a==="seed"){b.disabled=true;await seed();return}
  if(a==="start"){S.started=true;location.hash="#my";render();return}
  if(a==="wipe"){
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="한 번 더 누르면 모두 삭제";return}
    b.disabled=true;for(const it of S.items.slice()){await delItem(it.id)}await putProfile({});S.started=true;toast("모든 기록을 지웠습니다");return;
  }
  if(a==="copy"){
    const w=b.dataset.what;
    const t=w==="acts"?topActivities().map(caActText).join("\n\n"):w==="hons"?topHonors().map(caHonText).join("\n\n"):$("#brag").value;
    copyText(t,w==="brag"?$("#brag"):null);return;
  }
  if(a==="export"){
    if(!dl){toast("이 화면에서는 파일 저장을 쓸 수 없어요");return}
    const sel=$("#exp-school"),school=sel?sel.value:"";
    const nm=(S.profile.name||"portfolio").replace(/[^\w가-힣 -]/g,"").trim()||"portfolio";
    try{await dl.save({filename:`${nm} 포트폴리오${school?" - "+school.replace(/[^\w가-힣 -]/g,""):""}.html`,data:exportDoc(school)});toast("파일을 저장했습니다")}
    catch(err){if(err&&err.code!=="declined")toast("파일을 저장하지 못했어요")}
    return;
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="pf"){
    const f=e.target,p=Object.assign({},S.profile);["name","school","grade","major"].forEach(k=>p[k]=f.elements[k].value.trim());
    delete p.example;S.started=true;await putProfile(p);toast("프로필을 저장했습니다");return;
  }
  if(e.target.id==="mf"&&M){
    const f=e.target,data=readForm(f);
    const miss=FIELDS[M.type].flatMap(x=>x.row||[x]).find(d=>d.req&&!String(data[d.k]||"").trim());
    if(miss){toast(`'${miss.l}'을(를) 입력해 주세요`);const el=f.elements[miss.k];if(el&&el.focus)el.focus();return}
    if(M.type==="target"){
      const p=Object.assign({},S.profile),list=(p.targets||[]).slice(),t=Object.assign({id:M.item?M.item.id:rid()},data);
      const i=list.findIndex(x=>x.id===t.id);if(i>=0)list[i]=t;else list.push(t);p.targets=list;closeForm();S.started=true;await putProfile(p);toast("저장했습니다");return;
    }
    const base=M.item?Object.assign({},M.item):{id:M.id,type:M.type,created:Date.now()};
    const it=Object.assign(base,data);delete it.example;
    M.keep=true;closeForm();S.started=true;await putItem(it);toast("저장했습니다");
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.max){const c=document.getElementById("c-"+t.name);if(c){const n=t.value.length;c.textContent=n+"/"+t.dataset.max;c.classList.toggle("over",n>+t.dataset.max)}}
  if(t.name==="body"&&M&&M.type==="essay"){const w=$("#wc");if(w)w.textContent=words(t.value)+" words"}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("#lb").innerHTML){$("#lb").innerHTML="";return}if(M)closeForm()});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="ph-file"&&M&&t.files&&t.files.length){
    const room=6-photosOf(M.id).length;const files=[...t.files].slice(0,room);
    const lab=t.closest(".upl");if(lab)lab.lastChild.textContent="올리는 중…";
    const n=await addPhotos(files,M.id);refreshPhotoEdit();if(n)toast(`사진 ${n}장을 추가했습니다`);
  }
  if(t.id==="av-file"&&t.files&&t.files[0]){
    const old=photosOf("profile").map(p=>p.id);
    const n=await addPhotos([t.files[0]],"profile");
    if(n){for(const id of old)await delItem(id);toast("프로필 사진을 바꿨습니다")}
    render();
  }
});


/* ---------- seed ---------- */
async function seed(){
  const {P,L}=sample();
  if(S.mode!=="db"){S.profile=P;S.items=L;S.started=true;render();toast("예시 데이터를 불러왔습니다");return}
  toast("예시 데이터를 넣는 중…");
  try{await col.doc("profile").set(P);for(const it of L){await col.doc(it.id).set(it)}S.started=true;toast("예시 데이터를 불러왔습니다")}
  catch(e){toast("예시 데이터를 넣지 못했어요")}
}

/* ---------- boot ---------- */
const LS="spike-portfolio-v1";
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,items:S.items}))}catch(e){toast("이 브라우저에 더 저장할 공간이 없어요. 사진 수를 줄여 주세요")}}
function local(){
  dl={save:({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:"text/html"}));const x=document.createElement("a");x.href=u;x.download=filename;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return Promise.resolve({status:"saved"})}};
  let d=null;try{d=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){d=null}
  try{localStorage.setItem(LS+"-t","1");localStorage.removeItem(LS+"-t");S.mode="local"}catch(e){demo();return}
  if(d){S.profile=d.profile||{};S.items=d.items||[];if(S.items.length||S.profile.name)S.started=true}
  render();
}
function demo(){S.mode="demo";const {P,L}=sample();S.profile=P;S.items=L;render()}
async function boot(){
  setRoute();
  if(!window.claude||!window.claude.use){local();return}
  try{
    const [d,u,dw]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
    dl=dw;
    uid=u?await u.id():null;
    if(!d||!uid){demo();return}
    db=d;col=db.collection("data/users/"+uid);
    S.mode="db";render();
    unsub=col.onSnapshot(snap=>{
      const items=[];let prof={};
      snap.docs.forEach(doc=>{if(!doc.exists)return;const v=Object.assign({},doc.data());if(doc.id==="profile")prof=v;else{v.id=doc.id;items.push(v)}});
      S.items=items;S.profile=prof;if(items.length||prof.name)S.started=true;
      if(!M)render();else{renderChrome();refreshPhotoEdit()}
    },err=>{toast("기록을 불러오지 못했어요. 체험 모드로 전환합니다");demo()});
  }catch(e){demo()}
}
boot();
})();
</script>
